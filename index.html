<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#071225">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="EverSong">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./style.css">
  <title>EverSong</title>
</head>
<body>
  <canvas id="visual" aria-hidden="true"></canvas>
  <main>
    <header><h1>ever song</h1><p id="status" aria-live="polite"></p></header>
    <section class="controls" aria-label="Music controls">
      <p class="mood-hint">52 moods · scroll</p>
      <div class="moods" aria-label="Mood" tabindex="0">
        <button data-mood="calm" aria-pressed="false"><i></i>Calm</button>
        <button data-mood="night" aria-pressed="true"><i></i>Night</button>
        <button data-mood="jazz" aria-pressed="false"><i></i>Jazz</button>
        <button data-mood="upbeat" aria-pressed="false"><i></i>Upbeat</button>
        <button data-mood="dream" aria-pressed="false"><i></i>Dream</button>
        <button data-mood="mist" aria-pressed="false"><i></i>Mist</button>
        <button data-mood="pulse" aria-pressed="false"><i></i>Pulse</button>
        <button data-mood="sunrise" aria-pressed="false"><i></i>Sunrise</button>
        <button data-mood="lunar" aria-pressed="false"><i></i>Lunar</button>
        <button data-mood="drift" aria-pressed="false"><i></i>Drift</button>
        <button data-mood="noir" aria-pressed="false"><i></i>Noir</button>
        <button data-mood="spark" aria-pressed="false"><i></i>Spark</button>
        <button data-mood="ember" aria-pressed="false"><i></i>Ember</button><button data-mood="tide" aria-pressed="false"><i></i>Tide</button><button data-mood="forest" aria-pressed="false"><i></i>Forest</button><button data-mood="snow" aria-pressed="false"><i></i>Snow</button>
        <button data-mood="rain" aria-pressed="false"><i></i>Rain</button><button data-mood="dusk" aria-pressed="false"><i></i>Dusk</button><button data-mood="aurora" aria-pressed="false"><i></i>Aurora</button><button data-mood="velvet" aria-pressed="false"><i></i>Velvet</button>
        <button data-mood="glass" aria-pressed="false"><i></i>Glass</button><button data-mood="bloom" aria-pressed="false"><i></i>Bloom</button><button data-mood="canyon" aria-pressed="false"><i></i>Canyon</button><button data-mood="harbor" aria-pressed="false"><i></i>Harbor</button>
        <button data-mood="meadow" aria-pressed="false"><i></i>Meadow</button><button data-mood="cloud" aria-pressed="false"><i></i>Cloud</button><button data-mood="starlit" aria-pressed="false"><i></i>Starlit</button><button data-mood="echo" aria-pressed="false"><i></i>Echo</button>
        <button data-mood="orbit" aria-pressed="false"><i></i>Orbit</button><button data-mood="neon" aria-pressed="false"><i></i>Neon</button><button data-mood="copper" aria-pressed="false"><i></i>Copper</button><button data-mood="ivory" aria-pressed="false"><i></i>Ivory</button>
        <button data-mood="moss" aria-pressed="false"><i></i>Moss</button><button data-mood="ocean" aria-pressed="false"><i></i>Ocean</button><button data-mood="desert" aria-pressed="false"><i></i>Desert</button><button data-mood="frost" aria-pressed="false"><i></i>Frost</button>
        <button data-mood="lantern" aria-pressed="false"><i></i>Lantern</button><button data-mood="river" aria-pressed="false"><i></i>River</button><button data-mood="thunder" aria-pressed="false"><i></i>Thunder</button><button data-mood="breeze" aria-pressed="false"><i></i>Breeze</button>
        <button data-mood="solstice" aria-pressed="false"><i></i>Solstice</button><button data-mood="equinox" aria-pressed="false"><i></i>Equinox</button><button data-mood="comet" aria-pressed="false"><i></i>Comet</button><button data-mood="halo" aria-pressed="false"><i></i>Halo</button>
        <button data-mood="monsoon" aria-pressed="false"><i></i>Monsoon</button><button data-mood="twilight" aria-pressed="false"><i></i>Twilight</button><button data-mood="chapel" aria-pressed="false"><i></i>Chapel</button><button data-mood="arcade" aria-pressed="false"><i></i>Arcade</button>
        <button data-mood="voyage" aria-pressed="false"><i></i>Voyage</button><button data-mood="oasis" aria-pressed="false"><i></i>Oasis</button><button data-mood="phantom" aria-pressed="false"><i></i>Phantom</button><button data-mood="fiesta" aria-pressed="false"><i></i>Fiesta</button>
      </div>
      <div class="transport">
        <button id="mutate" aria-label="Mutate next phrase"><span>⚄</span> mutate</button>
        <button id="play" aria-label="Play music"><span>▶</span></button>
        <div class="spacer"></div>
      </div>
    </section>
  </main>
  <div id="toast" role="status">No sound? Check your device’s silent switch.</div>
  <footer class="app-footer">
    <a href="about.html">About</a> · <a href="privacy.html">Privacy</a>
  </footer>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
